
  <!DOCTYPE html>
  <html id="html-root">
    <head>
      <script>
        (function() {
          var savedLanguage = localStorage.getItem('language');
          if (savedLanguage === 'en' || savedLanguage === 'es') {
            document.documentElement.lang = savedLanguage;
          } else {
            document.documentElement.lang = navigator.language.toLowerCase().startsWith('es') ? 'es' : 'en';
          }
        })();
      </script>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/x-icon" href="/favicon.ico" />
      <title>Portfolio - JLE</title>

      <!-- Open Graph / Meta -->
      <meta property="og:type" content="website" />
      <meta property="og:url" content="https://jle-portfolio.netlify.app/" />
      <meta property="og:title" content="Portfolio - JLE" />
      <meta property="og:description" content="Web Developer Portfolio" />
      <meta property="og:image" content="https://jle-portfolio.netlify.app/og-image.jpg" />

      <!-- Twitter / X -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta property="twitter:domain" content="tudominio.com" />

      <meta name="twitter:title" content="Portfolio - JLE" />
      <meta name="twitter:description" content="Web Developer Portfolio" />
      <meta name="twitter:image" content="https://jle-portfolio.netlify.app/og-image.jpg" />
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
    </head>
